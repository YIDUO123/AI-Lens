name: Weekly Newsletter (retired)

# 已下线:每周周报被「每日精编推送」(daily-digest.yml)取代。
# 保留手动触发以备不时之需,但取消定时,不再自动发送。
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Hit newsletter endpoint
        run: |
          echo "🚀 触发周报发送…"
          curl -sSf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PROD_URL }}/api/cron/newsletter" | tee response.json
          echo ""
          echo "✅ 发送完成"
